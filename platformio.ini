; ============================================================================
;  CNC Touchscreen Pendant  -  Waveshare ESP32-S3-Touch-LCD-7  ->  GRBL (Uno)
; ============================================================================
;  Build:   pio run
;  Flash:   pio run -t upload
;  Monitor: pio device monitor
; ============================================================================

[platformio]
default_envs = waveshare_esp32s3_touch_lcd_7
boards_dir = boards

[env:waveshare_esp32s3_touch_lcd_7]
; The espressif32 official platform does not yet track Arduino v3.1.x, so we use
; the community pioarduino build (same one the ESP32_Display_Panel example uses).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
    ; High-performance libs to avoid the ESP32-S3 RGB "screen drift" issue
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
framework = arduino
board = BOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_7

monitor_speed = 115200
upload_speed = 921600

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
    https://github.com/lvgl/lvgl.git#v8.4.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; --- LVGL ---
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_COLOR_16_SWAP=0            ; RGB panel: no byte swap
    ; --- ESP32_Display_Panel: use the built-in supported-board profile ---
    -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -DBOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_7
    ; --- Project include path ---
    -I src
